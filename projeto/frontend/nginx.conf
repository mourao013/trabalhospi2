# Primeira barreira contra sobrecarga: limita requisições e conexões por IP
# ANTES de chegarem ao Gunicorn.
limit_req_zone  $binary_remote_addr zone=api_por_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexoes_por_ip:10m;

upstream api_backend {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req  zone=api_por_ip burst=40 nodelay;
        limit_conn conexoes_por_ip 30;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;   # > timeout da busca (5s) e do Gunicorn (30s)
    }

    # Erros do próprio Nginx também em JSON
    error_page 429 = @muitas;
    location @muitas {
        default_type application/json;
        return 429 '{"sucesso":false,"erro":{"codigo":"MUITAS_REQUISICOES","mensagem":"Muitas requisições. Aguarde um instante.","status":429}}';
    }
    error_page 502 503 504 = @indisponivel;
    location @indisponivel {
        default_type application/json;
        return 503 '{"sucesso":false,"erro":{"codigo":"API_INDISPONIVEL","mensagem":"API indisponível ou iniciando (importação de dados em andamento?).","status":503}}';
    }
}
